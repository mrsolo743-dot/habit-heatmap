<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Heatmap — трекер привычек</title>
  <meta name="description" content="Трекер привычек с тепловой картой в стиле GitHub. Работает офлайн, данные хранятся в браузере.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1' fill='%232f9e44'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1' fill='%2369db7c'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1' fill='%23b2f2bb'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1' fill='%232f9e44'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <h1>Habit Heatmap</h1>
    <div class="topbar-actions">
      <button type="button" id="export-btn" class="btn ghost">Экспорт</button>
      <label class="btn ghost" for="import-input">Импорт</label>
      <input type="file" id="import-input" accept="application/json,.json" hidden>
      <button type="button" id="theme-btn" class="btn ghost" aria-label="Переключить тему">Тема</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel habits-panel" aria-labelledby="habits-title">
      <h2 id="habits-title">Привычки <span class="muted" id="today-label"></span></h2>

      <form id="add-form" class="add-form" autocomplete="off">
        <input id="habit-name" name="name" type="text" maxlength="60" placeholder="Новая привычка, например «Читать 20 минут»" required>
        <input id="habit-color" name="color" type="color" value="#2f9e44" aria-label="Цвет">
        <button type="submit" class="btn primary">Добавить</button>
      </form>
      <p id="form-error" class="error" role="alert" hidden></p>

      <ul id="habit-list" class="habit-list"></ul>
      <p id="empty-hint" class="muted empty" hidden>Пока нет привычек. Добавьте первую — и отмечайте её каждый день.</p>
    </section>

    <section class="panel map-panel" aria-labelledby="map-title">
      <div class="map-head">
        <h2 id="map-title">Тепловая карта</h2>
        <select id="view-select" aria-label="Что показывать"></select>
      </div>
      <div id="heatmap" class="heatmap"></div>
      <div class="legend" aria-hidden="true">
        <span class="muted">меньше</span>
        <i class="hm-cell lvl-0"></i><i class="hm-cell lvl-1"></i><i class="hm-cell lvl-2"></i><i class="hm-cell lvl-3"></i><i class="hm-cell lvl-4"></i>
        <span class="muted">больше</span>
      </div>
      <p class="muted hint" id="map-hint"></p>

      <div id="stats" class="stats"></div>

      <h3>По неделям</h3>
      <div id="weekly" class="weekly"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
